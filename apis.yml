name: HelloFresh
description: 'HelloFresh SE is a publicly listed (Frankfurt Stock Exchange: HFG), Berlin-headquartered
  global meal-kit and food-solutions company that ships recipes and pre-portioned ingredients to
  households across North America, Europe, and Asia-Pacific. Its brand portfolio includes HelloFresh,
  Factor, Green Chef, EveryPlate, Chefs Plate, Youfoodz, and Good Chop. HelloFresh does not publish
  a public consumer developer API; its engineering organization is active in open source on GitHub,
  maintaining widely used infrastructure tooling such as the Janus API gateway, the health-go
  healthcheck library, and the goengine event-sourcing framework. This profile was surfaced as a
  portfolio company of HV Capital and Insight Partners and enriched by the API Evangelist pipeline.'
